  #   environment:
  #     - KC_BOOTSTRAP_ADMIN_USERNAME=admin
  #     - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
  #     - KC_DB=dev-file
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   command: start-dev
  #   volumes:
  #     - keycloak-data:/opt/keycloak/data
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 30s
  #     retries: 5
  #   networks:
  #     - atlas-network

networks:
  atlas-network:
    driver: bridge

